[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tease"
version = "0.1.0"
description = "TEASE: Thompson-style Gaussian score sampling for EASE recommenders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["recommender-systems", "ease", "thompson-sampling", "ranking", "collaborative-filtering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/drdakjak/tEASE"
Repository = "https://github.com/drdakjak/tEASE"
Issues = "https://github.com/drdakjak/tEASE/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tease", "tease.*"]
